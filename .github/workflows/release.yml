name: Release Windows & Linux

# Tag `win-v<N>` builds both platforms and publishes a GitHub Release.
# <N> must equal CURRENT_VERSION in Windows_and_Linux/update_checker.py
# (run `python Windows_and_Linux/bump_version.py <N>` before tagging).
# Manual runs (workflow_dispatch) only build and upload artifacts, unless
# `release_tag` names an EXISTING release (e.g. win-v1): then the build from the
# selected branch replaces that release's assets and notes. The tag is not moved.
on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to refresh with this build (e.g. win-v1). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/win-v') || startsWith(inputs.release_tag, 'win-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and release notes
        id: meta
        env:
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          version="${tag#win-v}"
          notes="Windows_and_Linux/release-notes/${tag}.md"
          test -f "$notes" || { echo "::error::Missing $notes - write the release notes before tagging"; exit 1; }
          grep -q "^## \[${version}\]" Windows_and_Linux/CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for [${version}]"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "AI Shortcuts v${{ steps.meta.outputs.version }} — Windows & Linux"
          body_path: ${{ steps.meta.outputs.notes }}
          # Keep the macOS release as "Latest".
          make_latest: "false"
          files: out/*
          fail_on_unmatched_files: true
