name: CI

# Runs on every pull request, but the heavy jobs only run when code or workflows
# changed (see `changes`). The only required check is `CI result`, which always
# reports: a workflow-level path filter or a skipped matrix job would leave a
# required check pending forever and block docs-only PRs.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "Windows_and_Linux/**"
      - "macOS/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      mac: ${{ steps.diff.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "mac=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if echo "$changed" | grep -qE '^(Windows_and_Linux/|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No Windows/Linux code or workflow changes: skipping checks and builds."
          fi
          if echo "$changed" | grep -qE '^(macOS/|\.github/workflows/)'; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
            echo "No macOS or workflow changes: skipping macOS build."
          fi

  checks:
    name: Checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: Windows_and_Linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Windows_and_Linux/requirements.txt

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xclip libegl1 libdbus-1-3 libglib2.0-0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies from requirements.txt
        run: pip install -r requirements.txt ruff

      - name: Lint (syntax errors, undefined names)
        run: ruff check --select E9,F63,F7,F82 --exclude .venv,dist,build,scratch .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Catches missing/mismatched dependencies in requirements.txt (e.g. a new SDK import).
      - name: Import check (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -c "import WritingToolApp, aiprovider"

      - name: Import check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import WritingToolApp, aiprovider"

  build:
    name: Build
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml

  build-mac:
    name: Build macOS
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    uses: ./.github/workflows/_build-mac.yml

  # The single required status check. Passes when jobs succeeded or were skipped.
  result:
    name: CI result
    needs: [changes, checks, build, build-mac]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
