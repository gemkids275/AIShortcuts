name: Release macOS

# Tag `mac-v<X.Y>` builds the macOS DMG and publishes a GitHub Release.
# <X.Y> must equal MARKETING_VERSION in the Xcode project, the tagged commit must be
# on `main`, and macOS/release-notes/mac-v<X.Y>.md must exist
# (run `macOS/bump_version.sh <X.Y>` before tagging).
# The update notice for existing users is a separate, later step: after the release
# exists, run `macOS/announce_update.sh <X.Y>` and merge that change.
# Manual runs (workflow_dispatch) only build and upload artifacts, unless
# `release_tag` names a tag (e.g. mac-v1.1): then the build from the `main` branch
# creates that release. The tag must not exist yet, or must already point at the
# commit being built.
on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or refresh with this build (e.g. mac-v1.1). Leave empty to only build artifacts."
        required: false
        default: ""
      sign_check:
        description: "Only check that the signing certificate works (a few minutes, no build, no release)."
        type: boolean
        default: false

permissions:
  contents: read

# Two runs for the same tag must not mix assets in one release.
concurrency:
  group: release-mac-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Validate version and notes
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: meta
        env:
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then tag="$GITHUB_REF_NAME"; else tag="$TAG_INPUT"; fi
          if [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release tag: build only."
            exit 0
          fi
          [[ "$tag" =~ ^mac-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Invalid release tag '$tag' (expected mac-v<X.Y>)"; exit 1; }
          version="${tag#mac-v}"
          notes="macOS/release-notes/${tag}.md"
          test -f "$notes" || { echo "::error::Missing $notes - write the release notes before tagging"; exit 1; }
          project_version="$(grep -o 'MARKETING_VERSION = [^;]*' "macOS/AI Shortcuts.xcodeproj/project.pbxproj" | sed 's/.*= //' | sort -u)"
          echo "tag=$version MARKETING_VERSION=$project_version"
          [ "$version" = "$project_version" ] || {
            echo "::error::Tag and MARKETING_VERSION must be equal (run macOS/bump_version.sh)"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Tagged commit is not on main: merge the pull request first"; exit 1; }
          else
            existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag points at $existing, not at the commit being built ($GITHUB_SHA)"; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: ${{ !inputs.sign_check }}
    uses: ./.github/workflows/_build-mac.yml
    secrets: inherit

  # Quick health check of the signing certificate: signs two different binaries and
  # requires the same designated requirement (a stable app identity), not a code hash.
  sign-check:
    name: Check signing certificate
    if: ${{ inputs.sign_check }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import signing certificate
        working-directory: macOS
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: ./import_signing_cert.sh

      - name: Sign two different binaries
        run: |
          [ -n "${SIGN_IDENTITY:-}" ] || { echo "::error::No signing certificate configured"; exit 1; }
          security list-keychains -d user
          security find-identity -p codesigning
          for n in 1 2; do
            printf 'int main(void){return %s;}\n' "$n" > "t$n.c"
            clang "t$n.c" -o "t$n"
            codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" -i com.gemkids.writing-tools "t$n"
            codesign -dv "t$n" 2>&1 | grep -E "Signature|Authority|Identifier"
            codesign -d -r- "t$n" 2>&1 | grep designated | sed 's/^# //' > "dr$n.txt"
            cat "dr$n.txt"
          done
          ! grep -q cdhash dr1.txt || { echo "::error::Designated requirement is a code hash, not stable"; exit 1; }
          cmp dr1.txt dr2.txt || { echo "::error::Designated requirement differs between builds"; exit 1; }
          echo "Stable identity confirmed."

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    # Tag pushes, or manual runs from `main` only.
    if: ${{ !inputs.sign_check && needs.meta.outputs.tag != '' && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          # A new tag is created on the commit that was built, not on whatever main is now.
          target_commitish: ${{ github.sha }}
          name: "AI Shortcuts v${{ needs.meta.outputs.version }} — macOS"
          body_path: ${{ needs.meta.outputs.notes }}
          # Never take the "Latest" flag from the Windows & Linux release.
          make_latest: "false"
          files: out/*
          fail_on_unmatched_files: true

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets"
          echo "$assets" | grep -qx "AI_Shortcuts_v${VERSION}.dmg" && echo "$assets" | grep -qx "SHA256SUMS.txt" || {
            echo "::error::Release $TAG is missing the DMG or SHA256SUMS.txt"; exit 1; }
