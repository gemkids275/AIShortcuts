name: Release macOS

# Tag `mac-v<X.Y>` builds the macOS DMG and publishes a GitHub Release.
# <X.Y> must equal MARKETING_VERSION in the Xcode project and the contents of
# macOS/Latest_Version_for_Update_Check.txt (run `macOS/bump_version.sh <X.Y>`
# before tagging) and macOS/release-notes/mac-v<X.Y>.md must exist.
# Manual runs (workflow_dispatch) only build and upload artifacts, unless
# `release_tag` names a tag (e.g. mac-v1.1): then the build from the `main`
# branch creates or refreshes that release. The tag is not moved.
on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or refresh with this build (e.g. mac-v1.1). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  meta:
    name: Validate version and notes
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        env:
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then tag="$GITHUB_REF_NAME"; else tag="$TAG_INPUT"; fi
          if [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release tag: build only."
            exit 0
          fi
          [[ "$tag" =~ ^mac-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Invalid release tag '$tag' (expected mac-v<X.Y>)"; exit 1; }
          version="${tag#mac-v}"
          notes="macOS/release-notes/${tag}.md"
          test -f "$notes" || { echo "::error::Missing $notes - write the release notes before tagging"; exit 1; }
          project_version="$(grep -o 'MARKETING_VERSION = [^;]*' "macOS/AI Shortcuts.xcodeproj/project.pbxproj" | sed 's/.*= //' | sort -u)"
          file_version="$(tr -d '[:space:]' < macOS/Latest_Version_for_Update_Check.txt)"
          echo "tag=$version MARKETING_VERSION=$project_version Latest_Version file=$file_version"
          [ "$version" = "$project_version" ] && [ "$version" = "$file_version" ] || {
            echo "::error::Tag, MARKETING_VERSION and Latest_Version_for_Update_Check.txt must all be equal (run macOS/bump_version.sh)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_build-mac.yml

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    # Tag pushes, or manual refreshes that run from `main` only.
    if: needs.meta.outputs.tag != '' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "AI Shortcuts v${{ needs.meta.outputs.version }} — macOS"
          body_path: ${{ needs.meta.outputs.notes }}
          # Never take the "Latest" flag from the Windows & Linux release.
          make_latest: legacy
          files: out/*
          fail_on_unmatched_files: true
