name: Update website on release

# Runs when a release is published by hand (e.g. the macOS build) or when an
# existing release is edited after its assets were uploaded. Releases created by
# release.yml update the site from that workflow instead, because events caused by
# GITHUB_TOKEN do not start other workflows.
on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    uses: ./.github/workflows/_update-site.yml
    secrets: inherit
